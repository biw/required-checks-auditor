    types: [created, edited, deleted]

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  required-checks-auditor:
    name: Required checks auditor
    runs-on: ubuntu-latest
    steps:
      - uses: biw/required-checks-auditor@v1.0.0
